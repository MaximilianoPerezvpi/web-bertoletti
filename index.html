<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bertoletti Transporte y Logística Uruguay | Cargas Nacionales e Internacionales</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">

    <style>
        :root {
            --rojo-bertoletti: #C8102E;
            --rojo-light: #FEE2E2;
        }
        .bg-bertoletti { background-color: var(--rojo-bertoletti) !important; }
        .text-bertoletti { color: var(--rojo-bertoletti) !important; }
        
        /* --- ANIMACIÓN PARA EL MENSAJE DE ÉXITO --- */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-animation {
            animation: fadeInUp 0.6s ease-out forwards;
            display: block !important;
        }

        .bg-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,0.05) 35px, rgba(255,255,255,0.05) 70px);
        }

        html { scroll-behavior: smooth; }
        
        .contact-icon-box {
            background-color: var(--rojo-light);
            color: var(--rojo-bertoletti);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #E5E7EB;
            background-color: #F9FAFB;
            outline: none;
            transition: border 0.2s;
        }
        .form-input:focus { border-color: var(--rojo-bertoletti); }

        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            filter: blur(5px);
            transition: all 1s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }
        .btn-shine {
            position: relative;
            overflow: hidden;
        }
        .btn-shine::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 6s infinite; 
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }
        .carousel-slide {
            min-width: 100%;
            flex-shrink: 0;
            height: 100%;
        }
        .carousel-indicator.active {
            background-color: var(--rojo-bertoletti);
            transform: scale(1.2);
            opacity: 1;
        }
    </style>
</head>
<body class="text-gray-800 bg-white font-sans">

    <section id="contacto" class="py-24 bg-white">
        <div class="max-w-7xl mx-auto px-4">
            <div class="grid lg:grid-cols-2 gap-16">
                <div class="reveal-on-scroll">
                    <h2 class="text-5xl font-extrabold mb-8 text-gray-900">Contactanos</h2>
                    <p class="text-gray-600 text-lg mb-12">Solicite su presupuesto sin compromiso. Nuestro equipo está disponible para asesorarlo.</p>
                    <div class="space-y-10">
                        </div>
                </div>

                <div class="bg-white p-8 lg:p-10 rounded-3xl border border-gray-100 shadow-2xl reveal-on-scroll">
                    <h3 class="text-3xl font-bold mb-8 text-gray-900">Solicitar Presupuesto</h3>
                    
                    <form id="contact-form" class="space-y-6">
                        <input type="hidden" name="title" value="Presupuesto Web">

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2 text-gray-900">Nombre *</label>
                                <input type="text" name="from_name" id="nombre" placeholder="Su nombre" class="form-input" required>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2 text-gray-900">Empresa</label>
                                <input type="text" name="company" id="empresa" placeholder="Nombre de empresa" class="form-input">
                            </div>
                        </div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2 text-gray-900">Email *</label>
                                <input type="email" name="from_email" id="email" placeholder="email@ejemplo.com" class="form-input" required>
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2 text-gray-900">Teléfono *</label>
                                <input type="tel" name="phone" id="telefono" placeholder="+598..." class="form-input" required>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-900">Tipo de Carga</label>
                            <select name="cargo_type" id="tipo_carga" class="form-input">
                                <option value="Granos">Granos</option>
                                <option value="Maquinaria">Maquinaria</option>
                                <option value="Carga General">Carga General</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-900">Mensaje</label>
                            <textarea name="message" id="mensaje" rows="4" placeholder="Describa su necesidad..." class="form-input"></textarea>
                        </div>
                        <button type="submit" id="btn-submit" class="w-full bg-bertoletti text-white font-bold py-4 rounded-xl shadow-lg hover:opacity-95 transition-all btn-shine">
                            Solicitar Presupuesto
                        </button>
                        
                        <div id="form-success" class="hidden mt-4 p-4 rounded-lg bg-green-50 border border-green-200 text-green-700 text-center font-semibold shadow-sm">
                           <i class="ri-checkbox-circle-line mr-1"></i> ✔️ Consulta enviada correctamente. Nos comunicaremos a la brevedad.
                        </div>

                        <p class="text-sm text-gray-500 text-center mt-4">
                           Un asesor se comunicará a la brevedad por WhatsApp o Email.
                        </p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // --- CONFIGURACIÓN EMAILJS ---
            const PUBLIC_KEY = "TItfJeV8MLV6pR3Lc"; 
            const SERVICE_ID = "service_2qeuge7";
            const TEMPLATE_ID = "template_o42lg9t";

            emailjs.init(PUBLIC_KEY);

            const contactForm = document.getElementById('contact-form');
            const btnSubmit = document.getElementById('btn-submit');
            const successMsg = document.getElementById("form-success");

            if (contactForm) {
                contactForm.addEventListener('submit', function(event) {
                    event.preventDefault();
                    
                    // Estado de carga
                    btnSubmit.innerText = "Enviando...";
                    btnSubmit.disabled = true;

                    // Envío solo a través de EmailJS
                    emailjs.sendForm(SERVICE_ID, TEMPLATE_ID, this)
                        .then(function() {
                            // Mostrar mensaje con animación
                            successMsg.classList.remove("hidden");
                            successMsg.classList.add("success-animation");
                            
                            // Resetear formulario
                            contactForm.reset();
                            btnSubmit.innerText = "Solicitar Presupuesto";
                            btnSubmit.disabled = false;
                            
                            // Ocultar mensaje después de 6 segundos
                            setTimeout(() => { 
                                successMsg.classList.remove("success-animation");
                                successMsg.classList.add("hidden"); 
                            }, 6000);
                            
                        }, function(error) {
                            alert("Error al enviar: " + JSON.stringify(error));
                            btnSubmit.innerText = "Reintentar Envío";
                            btnSubmit.disabled = false;
                        });
                });
            }

            // --- ANIMACIONES DE SCROLL (MANTENER) ---
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal-visible');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));

            // --- LÓGICA DE CARRUSEL (MANTENER) ---
            const track = document.querySelector('.js-carousel-track');
            if (track) {
                const slides = Array.from(track.children);
                const nextButton = document.querySelector('.js-carousel-next');
                const prevButton = document.querySelector('.js-carousel-prev');
                const indicatorsNav = document.querySelector('.js-carousel-indicators');

                let currentSlideIndex = 0;
                slides.forEach((_, index) => {
                    const indicator = document.createElement('button');
                    indicator.className = 'carousel-indicator w-3 h-3 rounded-full bg-white/50 transition-all';
                    if (index === 0) indicator.classList.add('active');
                    indicatorsNav.appendChild(indicator);
                });

                const updateCarousel = (index) => {
                    track.style.transform = `translateX(-${index * 100}%)`;
                    Array.from(indicatorsNav.children).forEach((ind, i) => {
                        ind.classList.toggle('active', i === index);
                    });
                };

                nextButton.addEventListener('click', () => {
                    currentSlideIndex = (currentSlideIndex + 1) % slides.length;
                    updateCarousel(currentSlideIndex);
                });
                prevButton.addEventListener('click', () => {
                    currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length;
                    updateCarousel(currentSlideIndex);
                });
            }
        });
    </script>
</body>
</html>
