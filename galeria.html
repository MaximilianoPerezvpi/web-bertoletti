<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Flota | Bertoletti Transporte y Logística</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css">

    <style>
        :root { --rojo-bertoletti: #C8102E; }
        .text-bertoletti { color: var(--rojo-bertoletti) !important; }
        .bg-bertoletti { background-color: var(--rojo-bertoletti) !important; }

        /* --- ANIMACIONES DE SCROLL (RESTAURADAS) --- */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            filter: blur(5px);
            transition: all 1s cubic-bezier(0.5, 0, 0, 1);
        }
        .reveal-visible {
            opacity: 1;
            transform: translateY(0);
            filter: blur(0);
        }

        /* --- EFECTOS DE IMAGEN --- */
        .shine-effect { position: relative; overflow: hidden; }
        .shine-effect::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg); transition: 0.7s;
        }
        .shine-effect:hover::after { left: 125%; }

        .img-zoom { transition: transform 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); }
        .gallery-card:hover .img-zoom { transform: scale(1.1); }

        #lightbox { transition: opacity 0.3s ease-in-out; backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 lg:h-20 flex justify-between items-center">
            <a href="index.html"><img alt="Bertoletti" class="h-10 lg:h-12" src="./Bertoletti Transporte y Logística Uruguay - Más de 35 Años de Experiencia_files/5da04e1137e321cc852d1d06dfc786ba.jpeg"></a>
            <nav class="hidden lg:flex space-x-8 font-medium">
                <a href="index.html#inicio" class="hover:text-bertoletti transition-colors">Inicio</a>
                <a href="index.html#servicios" class="hover:text-bertoletti transition-colors">Servicios</a>
                <a href="#" class="text-bertoletti font-bold border-b-2 border-bertoletti">Galería</a>
                <a href="index.html#contacto" class="hover:text-bertoletti transition-colors">Contacto</a>
            </nav>
            <a href="index.html#contacto" class="bg-bertoletti text-white px-6 py-2 rounded-lg font-bold hover:opacity-90 transition-opacity">Solicitar presupuesto</a>
        </div>
    </header>

    <section class="py-20 bg-gray-900 relative overflow-hidden">
        <div class="absolute inset-0 opacity-20"><img src="img/portada.jpg" class="w-full h-full object-cover" alt=""></div>
        <div class="relative z-10 max-w-7xl mx-auto px-4 text-center reveal-on-scroll">
            <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-4">Nuestra flota</h1>
            <p class="text-xl text-gray-300 max-w-2xl mx-auto">Equipamiento moderno para desafíos internacionales.</p>
        </div>
    </section>

    <section class="py-16 max-w-7xl mx-auto px-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" id="gallery-grid">
            </div>
    </section>

    <footer class="bg-gray-900 text-white py-12 text-center">
        <p class="text-gray-500 mb-2 uppercase tracking-widest text-xs font-bold">Edgardo Bertoletti S.A.</p>
        <div class="mt-6"><a href="index.html" class="text-bertoletti font-bold hover:underline">← Volver al inicio</a></div>
        <div class="mt-8 pt-8 border-t border-gray-800 opacity-40 hover:opacity-100 transition-opacity duration-500">
    <p class="text-[10px] tracking-[0.2em] uppercase font-medium text-center">
        Sitio Web Diseñado por 
        <a href="https://www.instagram.com/maxii_perez14" target="_blank" class="text-bertoletti font-bold hover:underline">
            Maximiliano Perez
        </a>
    </p>
</div>
    </footer>

    <div id="lightbox" class="fixed inset-0 z-[100] hidden bg-black/95 items-center justify-center p-4" onclick="closeLightbox()">
        <button class="absolute top-6 right-6 text-white text-4xl"><i class="ri-close-fill"></i></button>
        <img id="lightbox-img" src="" class="max-h-[85vh] max-w-full rounded-lg shadow-2xl transform transition-transform duration-300 scale-95" onclick="event.stopPropagation()">
    </div>

<script>
        const totalFotos = 30;
        const grid = document.getElementById('gallery-grid');

        // Generar fotos con animación de aparición
        for(let i=1; i<=totalFotos; i++) {
            grid.innerHTML += `
                <div class="gallery-card reveal-on-scroll group relative bg-white rounded-2xl shadow-md overflow-hidden cursor-pointer shine-effect" onclick="openLightbox('img/camion${i}.jpg')">
                    <div class="h-72 overflow-hidden">
                        <img src="img/camion${i}.jpg" class="img-zoom w-full h-full object-cover" alt="Unidad Bertoletti">
                    </div>
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <i class="ri-zoom-in-line text-white text-3xl"></i>
                    </div>
                </div>`;
        }

        // Lógica de Animación al Scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal-visible');
                }
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));

        // Lógica Lightbox
        const lb = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');

        function openLightbox(src) {
            lbImg.src = src;
            lb.classList.replace('hidden', 'flex');
            setTimeout(() => lbImg.classList.replace('scale-95', 'scale-100'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lbImg.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                lb.classList.replace('flex', 'hidden');
                document.body.style.overflow = 'auto';
            }, 200);
        }
    </script>
</body>
</html>
